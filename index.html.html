<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>25th Ward Temple Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Lato:wght@300;400;700&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: #f5f3ef; font-family: 'Lato', sans-serif; display: flex; align-items: flex-start; justify-content: center; padding: 2rem 1rem; }
  .card { background: #fff; border-radius: 16px; box-shadow: 0 4px 32px rgba(83,74,183,0.10), 0 1px 4px rgba(0,0,0,0.06); padding: 2.5rem 2rem 2rem; max-width: 560px; width: 100%; text-align: center; }
  .eyebrow { font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: #534AB7; margin: 0 0 0.4rem; font-weight: 700; }
  .title { font-family: 'Playfair Display', serif; font-size: 28px; font-weight: 600; color: #1a1560; margin: 0 0 4px; }
  .subtitle { font-size: 13px; color: #888; letter-spacing: 0.06em; text-transform: uppercase; font-weight: 300; margin: 0 0 2rem; }
  .count-row { display: flex; align-items: baseline; justify-content: center; gap: 6px; margin-bottom: 0.5rem; }
  .count-big { font-family: 'Playfair Display', serif; font-size: 60px; font-weight: 600; color: #1a1560; line-height: 1; }
  .count-denom { font-size: 22px; color: #aaa; font-weight: 300; }
  .count-label { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: #aaa; margin: 0 0 1.2rem; }
  .bar-wrap { background: #eceaf7; border-radius: 999px; height: 12px; overflow: hidden; margin: 0 auto 0.4rem; max-width: 380px; }
  .bar-fill { height: 100%; background: linear-gradient(90deg, #534AB7, #7F77DD); border-radius: 999px; transition: width 0.6s cubic-bezier(.4,0,.2,1); }
  .pct-text { font-size: 13px; color: #aaa; margin: 0 0 1.5rem; }
  .puzzle-container { position: relative; width: 100%; border-radius: 10px; overflow: hidden; margin: 0 auto 1.5rem; box-shadow: 0 2px 16px rgba(83,74,183,0.12); }
  .puzzle-img { display: block; width: 100%; height: auto; }
  .puzzle-grid { display: grid; grid-template-columns: repeat(10, 1fr); position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
  .puzzle-piece { background: #534AB7; border: 0.5px solid rgba(255,255,255,0.07); transition: opacity 0.7s cubic-bezier(.4,0,.2,1); }
  .puzzle-piece.revealed { opacity: 0; pointer-events: none; }
  .controls { display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; margin-bottom: 1rem; }
  .ctrl-btn { font-family: 'Lato', sans-serif; font-size: 14px; padding: 9px 20px; border-radius: 8px; border: 1px solid #ddd; background: #fff; color: #333; cursor: pointer; }
  .ctrl-btn:hover { background: #f5f3ef; border-color: #b0aae0; }
  .ctrl-btn.primary { background: #534AB7; color: #fff; border-color: #534AB7; }
  .ctrl-btn.primary:hover { background: #3C3489; }
  .ctrl-input { font-family: 'Lato', sans-serif; font-size: 15px; width: 72px; padding: 8px 10px; border-radius: 8px; border: 1px solid #ddd; text-align: center; color: #333; }
  .congrats { display: none; font-family: 'Playfair Display', serif; font-size: 20px; color: #534AB7; margin-top: 0.5rem; }
</style>
</head>
